<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>互动课堂 · CMU11768 自学站</title>
<link rel="stylesheet" href="css/site.css"/>
<script src="js/site-shell.js"></script>
<script src="js/app.js"></script>
<script src="data/meta.js"></script>
<script src="data/tutor.js"></script>
<script src="data/classroom.js"></script>
<script src="js/classroom-engine.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const ids=SITE_META.order;
  const list=document.getElementById('lecList');
  const done=id=>!!CMU11768.loadProgress().lectures?.[id]?.done;
  const q=new URLSearchParams(location.search);
  let cur=q.get('lec')&&ids.includes(q.get('lec'))?q.get('lec'):ids[0];
  list.innerHTML=ids.map(id=>`<a class="cr-lec" data-lec="${id}"><span class="lec-code">${id}</span><span class="lec-t">${SITE_META.lectures[id].title}</span>${done(id)?'<span class="ok">已读</span>':''}</a>`).join('');
  const panel=document.getElementById('crPanel');
  function go(id){cur=id;const u=new URL(location.href);u.searchParams.set('lec',id);history.replaceState(null,'',u);
    list.querySelectorAll('.cr-lec').forEach(a=>a.classList.toggle('active',a.dataset.lec===id));
    document.getElementById('crTitle').textContent=`${id} · ${SITE_META.lectures[id].title}`;
    document.getElementById('crLecLink').href=`lectures/${id}.html`;
    CR.mount(panel,id);}
  list.querySelectorAll('.cr-lec').forEach(a=>a.onclick=()=>go(a.dataset.lec));
  document.getElementById('crOverlayBtn').onclick=()=>CR.openOverlay(cur);
  go(cur);
});
</script>
</head>
<body>
<a class="skip-link" href="#mainContent">跳到主要内容</a>
<header class="topbar"></header>
<div class="layout">
<aside class="sidebar" style="display:block"><h3>讲次课堂</h3><div id="lecList"></div></aside>
<main class="main" id="mainContent">
<div class="cr-page-head"><div><span class="eyebrow">CLASSROOM / 互动课堂</span><h1 id="crTitle" style="margin:4px 0 0"></h1><p class="muted" style="margin:4px 0 0">每讲 4 幕：讲解 → 追问 → 决策/动手 → 回忆。作答与评分只存本机。</p></div>
<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost sm" id="crLecLink" href="#">本讲讲义 →</a><button type="button" class="btn sm" id="crOverlayBtn">全屏模式</button></div></div>
<div id="crPanel"></div>
</main></div>
</body></html>
